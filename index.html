    <!-- ═══════════════════════════ SHELF 1 ══════════════════════════════════

         Five groups — rhythm: anchor · cluster · pocket · pair+frame · anchor
         Composition: heavier left, lighter right, natural breathing throughout
    ════════════════════════════════════════════════════════════════════════ -->

      <div class="shelf__items">
