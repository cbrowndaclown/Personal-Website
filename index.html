<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Canaan Brown</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- Josefin Sans — Pixel FS LED typography bake only -->
  <link
    href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <!-- Porca — all non–Pixel FS UI text -->
  <link href="https://fonts.cdnfonts.com/css/porca" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body data-motion="on" data-bg-mode="heat" data-app-startup>

  <!-- One surface: nav + frame. Parked at translateY(-navH) so the frame is flush on load. -->
  <div class="site-frame" id="site-frame">
    <nav class="topnav" id="topnav" aria-label="Primary" aria-hidden="true">
      <div class="topnav__inner">
        <div class="topnav__cluster topnav__cluster--left">
          <span class="topnav__link" data-nav="networks">Networks</span>
          <span class="topnav__link" data-nav="projects">Projects</span>
        </div>

        <a href="#home" class="topnav__brand" id="nav-home">Canaan Brown</a>

        <div class="topnav__cluster topnav__cluster--right">
          <span class="topnav__link" data-nav="about">About</span>
          <span class="topnav__link" data-nav="connect">Connect</span>
        </div>

                />
                <path

                  d="M8 1h2v1H8zM4 2h1v1H4zM8 2h2v1H8zM3 3h3v1H3zM7 3h4v1H7zM12 3h2v1h-2zM4 4h10v1H4zM5 5h8v1H5zM4 6h4v1H4zM10 6h4v1h-4zM2 7h5v1H2zM11 7h4v1h-4zM2 8h5v1H2zM11 8h4v1h-4zM4 9h4v1H4zM10 9h4v1h-4zM5 10h8v1H5zM4 11h10v1H4zM3 12h11v1H3zM4 13h1v1H4zM8 13h2v1H8zM12 13h2v1h-2zM8 14h2v1H8z"
                />
              </svg>
              <svg
                class="settings__icon settings__icon--tools"
                viewBox="0 0 16 16"

                height="20"

                aria-hidden="true"

                />
                <path
                  class="settings__icon-mid"
                  d="M10 0h1v1h-1zM12 1h1v1h-1zM3 2h1v1H3zM13 2h1v1h-1zM8 3h1v1H8zM12 3h1v1h-1zM8 4h1v1H8zM4 5h1v1H4zM6 5h1v1H6zM8 5h1v1H8zM13 5h1v1h-1zM5 6h1v1H5zM7 6h1v1H7zM11 6h1v1h-1zM4 7h1v1H4zM6 7h5v1H6zM4 8h1v1H4zM6 8h1v1H6zM8 8h1v1H8zM3 9h1v1H3zM5 9h1v1H5zM7 9h1v1H7zM2 10h1v1H2zM4 10h1v1H4zM6 10h1v1H6zM5 11h1v1H5zM2 12h1v1H2zM5 12h1v1H5zM2 13h1v1H2z"
                />

                />
                <path
                  class="settings__icon-orange-shade"
                  d="M8 12h1v1H8zM9 13h1v1H9zM10 14h1v1h-1z"
                />
                <path
                  class="settings__icon-orange"
                  d="M7 10h1v1H7zM8 11h2v1H8zM9 12h2v1H9zM10 13h2v1h-2zM11 14h1v1h-1z"
                />

                  class="settings__icon-orange-hl"
                  d="M8 9h2v1H8zM8 10h3v1H8zM10 11h2v1h-2zM11 12h2v1h-2zM12 13h1v1h-1zM12 14h1v1h-1z"
                />
              </svg>
            </span>
          </button>

          <div
            class="settings__panel"
            id="settings-panel"
            role="dialog"
            aria-modal="true"
            aria-labelledby="settings-title"
            aria-hidden="true"
          >
            <div class="settings__head">
              <h2 class="settings__title" id="settings-title">Settings</h2>
              <button type="button" class="settings__close" id="settings-close" aria-label="Close settings">✕</button>
            </div>
            <div class="settings__body" id="settings-body">
              <!-- Sections are mounted from js/settings definitions (data-driven catalog) -->
            </div>
          </div>
        </div>
      </div>
    </nav>

    <div class="page-shell" id="home">
      <header class="nameplate" aria-label="Canaan Brown">
        <svg class="nameplate__svg" overflow="visible" aria-hidden="true">
          <defs>
            <path id="nameplate-rim" fill="none" />
          </defs>
          <text class="nameplate__text">
            <textPath
              id="nameplate-tp"
              href="#nameplate-rim"
              xlink:href="#nameplate-rim"
              startOffset="0"
            ></textPath>
          </text>
        </svg>
      </header>

      <!--
        Ribbon frame (.page-shell) stays fixed.
        #app-scroll is the sole vertical scrollport (CSS snap between screens).
        Both screens expose the shared Pixel FS engine beneath independent content.
      -->
      <div class="app-scroll" id="app-scroll">
        <section
          class="pixel-fs-screen"
          id="pixel-fs-screen-1"
          aria-label="Pixel FS Screen 1"
        >
          <!-- Framed display: Screen 1 boundary stays open at the bottom -->
          <div class="stage">
            <div class="stage__field" id="stage">
              <canvas id="heatmap" class="heatmap" aria-hidden="true"></canvas>
              <div class="lightning-cursor" id="lightning-cursor" aria-hidden="true"></div>
            </div><!-- /.stage__field -->
          </div><!-- /.stage -->

          <footer class="site-footer">
            <span>© <span id="year"></span> Canaan Brown</span>
          </footer>
        </section>

        <section
          class="pixel-fs-screen"
          id="pixel-fs-screen-2"
          aria-label="Pixel FS Screen 2"
        >
          <!-- Shared Pixel FS display surface; content overlay remains a sibling -->
          <div class="stage stage--screen-2">
            <div class="stage__field stage__field--screen-2" id="stage-2">
              <canvas id="heatmap-2" class="heatmap" aria-hidden="true"></canvas>
              <div class="lightning-cursor" aria-hidden="true"></div>
            </div><!-- /.stage__field -->
          </div><!-- /.stage -->

          <!--
            Page 2 Menu — a11y / content anchors for Screen 2.
            Visual typography is rendered in the shared Pixel FS grid.
          -->
          <div
            class="page-2-menu"
            id="page-2-menu"
            aria-label="Page 2 Menu"
            aria-hidden="true"
            data-visibility="hidden"
            data-revealed="false"
            data-reveal-phase="idle"
          >
            <!-- data-line-key pairs each anchor with the LED line it mirrors,
                 so a cleared line stops being announced. -->
            <div class="page-2-menu__region page-2-menu__region--top">
              <p class="page-2-menu__line" data-line-key="header">Scroll up for header / top grid ↑</p>
            </div>
            <div class="page-2-menu__region page-2-menu__region--bottom-left">
              <p class="page-2-menu__line" data-line-key="options">/ for options</p>
              <p class="page-2-menu__line" data-line-key="more">Scroll down for more ↓</p>
            </div>
          </div><!-- /.page-2-menu -->
        </section>
      </div><!-- /.app-scroll -->
    </div><!-- /.page-shell -->
  </div><!-- /.site-frame -->

  <script src="lib/gsap/gsap.min.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
