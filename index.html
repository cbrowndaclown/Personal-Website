<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Canaan Brown</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400&family=Josefin+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@300&display=swap"
    rel="stylesheet"
  />
  <link href="https://fonts.cdnfonts.com/css/benz-grotesk" rel="stylesheet" />
  <link href="https://fonts.cdnfonts.com/css/inktera-bold-inktrap-font" rel="stylesheet" />
  <link href="https://fonts.cdnfonts.com/css/food-think" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body data-motion="on" data-bg-mode="heat">

  <!-- One surface: nav + frame. Parked at translateY(-navH) so the frame is flush on load. -->
  <div class="site-frame" id="site-frame">
    <nav class="topnav" id="topnav" aria-label="Primary" aria-hidden="true">
      <div class="topnav__inner">
        <div class="topnav__cluster topnav__cluster--left">
          <span class="topnav__link" data-nav="networks">Networks</span>
          <span class="topnav__link" data-nav="projects">Projects</span>
        </div>

        <a href="#home" class="topnav__brand" id="nav-home">Canaan Brown</a>

        <div class="topnav__cluster topnav__cluster--right">
          <span class="topnav__link" data-nav="about">About</span>
          <span class="topnav__link" data-nav="connect">Connect</span>
        </div>

        <div class="settings">
          <button
            type="button"
            class="settings__btn"
            id="settings-btn"
            aria-label="Open settings"
            aria-expanded="false"
            aria-controls="settings-panel"
          >
            <svg class="settings__icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
              <path
                fill="currentColor"
                d="M19.14 12.94c.04-.31.06-.63.06-.94s-.02-.63-.06-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96a7.2 7.2 0 0 0-1.62-.94l-.36-2.54a.48.48 0 0 0-.48-.41h-3.84a.48.48 0 0 0-.48.41l-.36 2.54c-.59.24-1.13.55-1.62.94l-2.39-.96a.49.49 0 0 0-.59.22L2.74 8.87a.48.48 0 0 0 .12.61l2.03 1.58c-.04.31-.06.63-.06.94s.02.63.06.94L2.86 14.5a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.3.59.22l2.39-.96c.5.39 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.48-.41l.36-2.54c.59-.24 1.13-.55 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32a.49.49 0 0 0-.12-.61l-2.03-1.58zM12 15.6A3.6 3.6 0 1 1 12 8.4a3.6 3.6 0 0 1 0 7.2z"
              />
            </svg>
          </button>

          <div
            class="settings__panel"
            id="settings-panel"
            role="dialog"
            aria-modal="true"
            aria-labelledby="settings-title"
            aria-hidden="true"
          >
            <div class="settings__head">
              <h2 class="settings__title" id="settings-title">Settings</h2>
              <button type="button" class="settings__close" id="settings-close" aria-label="Close settings">✕</button>
            </div>
            <div class="settings__body">
              <div class="settings__row">
                <div class="settings__meta">
                  <span class="settings__label" id="settings-motion-label">Motion</span>
                  <span class="settings__desc">Animations and pixel field</span>
                </div>
                <div
                  class="settings__seg"
                  id="settings-motion"
                  role="group"
                  aria-labelledby="settings-motion-label"
                  data-active="on"
                >
                  <span class="settings__seg-thumb" aria-hidden="true"></span>
                  <button type="button" class="settings__seg-opt is-active" data-value="on" aria-pressed="true">On</button>
                  <button type="button" class="settings__seg-opt" data-value="off" aria-pressed="false">Off</button>
                </div>
              </div>

              <div class="settings__row" id="settings-effect-row">
                <div class="settings__meta">
                  <span class="settings__label" id="settings-effect-label">Effect</span>
                  <span class="settings__desc">Pixel field style</span>
                </div>
                <div
                  class="settings__seg settings__seg--triple"
                  id="settings-effect"
                  role="group"
                  aria-labelledby="settings-effect-label"
                  data-active="heat"
                >
                  <span class="settings__seg-thumb" aria-hidden="true"></span>
                  <button type="button" class="settings__seg-opt is-active" data-value="heat" aria-pressed="true">Heat</button>
                  <button type="button" class="settings__seg-opt" data-value="wave" aria-pressed="false">Wave</button>
                  <button type="button" class="settings__seg-opt" data-value="lightning" aria-pressed="false">Lightning</button>
                </div>
              </div>

              <div class="settings__row" id="settings-color-row">
                <div class="settings__meta settings__meta--row">
                  <div>
                    <span class="settings__label" id="settings-color-label">Effect Color</span>
                    <span class="settings__desc">Shared by Heat, Wave, and Lightning</span>
                  </div>
                  <span
                    class="settings__swatch"
                    id="settings-color-swatch"
                    aria-hidden="true"
                    title="Current effect color"
                  ></span>
                </div>
                <div class="settings__colors" role="group" aria-labelledby="settings-color-label">
                  <label class="settings__slider">
                    <span class="settings__slider-label">R</span>
                    <input
                      type="range"
                      id="settings-color-r"
                      min="0"
                      max="255"
                      value="255"
                      aria-label="Red"
                    />
                    <span class="settings__slider-val" id="settings-color-r-val">255</span>
                  </label>
                  <label class="settings__slider">
                    <span class="settings__slider-label">G</span>
                    <input
                      type="range"
                      id="settings-color-g"
                      min="0"
                      max="255"
                      value="52"
                      aria-label="Green"
                    />
                    <span class="settings__slider-val" id="settings-color-g-val">52</span>
                  </label>
                  <label class="settings__slider">
                    <span class="settings__slider-label">B</span>
                    <input
                      type="range"
                      id="settings-color-b"
                      min="0"
                      max="255"
                      value="158"
                      aria-label="Blue"
                    />
                    <span class="settings__slider-val" id="settings-color-b-val">158</span>
                  </label>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </nav>

    <div class="page-shell" id="home">
      <header class="nameplate" aria-label="Canaan Brown">
        <svg class="nameplate__svg" overflow="visible" aria-hidden="true">
          <defs>
            <path id="nameplate-rim" fill="none" />
          </defs>
          <text class="nameplate__text">
            <textPath
              id="nameplate-tp"
              href="#nameplate-rim"
              xlink:href="#nameplate-rim"
              startOffset="0"
            ></textPath>
          </text>
        </svg>
      </header>

      <!-- Framed display: pixel field lives only inside; bottom edge stays open -->
      <div class="stage">
        <div class="stage__field" id="stage">
          <canvas id="heatmap" class="heatmap" aria-hidden="true"></canvas>
        </div><!-- /.stage__field -->
      </div><!-- /.stage -->

      <footer class="site-footer">
        <span>© <span id="year"></span> Canaan Brown</span>
      </footer>
    </div><!-- /.page-shell -->
  </div><!-- /.site-frame -->

  <script src="lib/gsap/gsap.min.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
